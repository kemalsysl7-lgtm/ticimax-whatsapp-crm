# Yerel demo: Ticimax ve Meta bağlantısı olmadan, örnek veriyle paneli açar.
# Kullanım (repo kökünden):
#   docker compose -f deploy/docker-compose.demo.yml up --build
# Ardından http://localhost:3001 — şifre: demo-sifre-2026
# Kapatmak ve veriyi silmek için: docker compose -f deploy/docker-compose.demo.yml down -v
#
# Buradaki değerler yalnızca bu yerel demo içindir; gerçek kurulumda kullanmayın.
# WhatsApp mesajları sahte bir Meta sunucusuna gider, kimseye gerçek mesaj gönderilmez.
x-demo-env: &demo-env
  NODE_ENV: development
  PORT: "3000"
  DATABASE_URL: postgres://crm:crm@postgres:5432/crm
  REDIS_URL: redis://redis:6379
  ADMIN_API_TOKEN: demo-admin-token-yalnizca-yerel-0000000
  TICIMAX_BASE_URL: http://127.0.0.1:9
  TICIMAX_UYE_KODU: demo
  WHATSAPP_GRAPH_BASE_URL: http://mock-graph:4000
  WHATSAPP_PHONE_NUMBER_ID: demo
  WHATSAPP_BUSINESS_ACCOUNT_ID: demo
  WHATSAPP_ACCESS_TOKEN: demo
  WHATSAPP_APP_SECRET: demo-app-secret
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: demo
  SYNC_INTERVAL_MINUTES: "60"

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment: *demo-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mock-graph:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      retries: 40

  # Tek seferlik: örnek veriyi yükler ve segmentleri hesaplar, sonra kapanır.
  demo-data:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment: *demo-env
    command:
      - sh
      - -c
      - >-
        node dist/db/seed-demo.js &&
        node -e "fetch('http://server:3000/admin/segments/recompute',{method:'POST',headers:{Authorization:'Bearer '+process.env.ADMIN_API_TOKEN}}).then(r=>{console.log('Segmentler hesaplandı:',r.status);process.exit(r.ok?0:1)})"
    depends_on:
      server:
        condition: service_healthy
    restart: "no"

  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    environment:
      API_BASE_URL: http://server:3000
      ADMIN_API_TOKEN: demo-admin-token-yalnizca-yerel-0000000
      PANEL_PASSWORD: demo-sifre-2026
      PANEL_SESSION_SECRET: demo-session-secret-yalnizca-yerel-00000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      demo-data:
        condition: service_completed_successfully

  mock-graph:
    image: node:22-alpine
    command: ["node", "/demo/mock-graph.mjs"]
    volumes:
      - ./demo/mock-graph.mjs:/demo/mock-graph.mjs:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - demodata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crm"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  demodata:
