# Tek VPS üzerinde production kurulumu. Kullanım (repo kökünden):
#   cp .env.example deploy/.env   # değerleri doldurun (DOMAIN, POSTGRES_PASSWORD, PANEL_* dahil)
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/crm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Yönetim paneli. Sunucunun yönetim API'sine iç ağdan erişir; ADMIN_API_TOKEN tarayıcıya gitmez.
  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    environment:
      API_BASE_URL: http://server:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN gerekli}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?PANEL_PASSWORD gerekli}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?PANEL_SESSION_SECRET gerekli}
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crm"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Meta webhook'u herkese açık HTTPS ister; Caddy sertifikayı otomatik alır.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - server
      - panel
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
